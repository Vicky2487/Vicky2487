<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540">
  <!-- Generated into terminal.svg by scripts/update_terminal.py — edit this template, not the output. -->
  <style>
    text { font-family: 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 15px; white-space: pre; }
    .c { fill: #00e5ff; }
    .v { fill: #8b6cff; }
    .w { fill: #e8ecf5; }
    .g { fill: #7f8aa3; }
    .d { fill: #3a4459; }

    /* the DocRepo scene: a document is scanned, splits into chunks, chunks get embedded */
    .paper   { animation: paper 7s infinite; }
    .ink     { animation: ink 7s infinite; }
    .scanner { animation: scanner 7s linear infinite; }
    .k1 { animation: k1 7s cubic-bezier(.5,0,.3,1) infinite; }
    .k2 { animation: k2 7s cubic-bezier(.5,0,.3,1) infinite; }
    .k3 { animation: k3 7s cubic-bezier(.5,0,.3,1) infinite; }
    .k4 { animation: k4 7s cubic-bezier(.5,0,.3,1) infinite; }
    .s1 { animation: s1 7s steps(1) infinite; }
    .s2 { animation: s2 7s steps(1) infinite; }
    .s3 { animation: s3 7s steps(1) infinite; }
    @keyframes paper   { 0% { opacity: 0; } 5%,88% { opacity: 1; } 96%,100% { opacity: 0; } }
    @keyframes ink     { 0%,25% { opacity: 1; } 34%,100% { opacity: .12; } }
    @keyframes scanner { 0%,5% { transform: translateY(0); opacity: 0; } 6%,22% { opacity: 1; } 22% { transform: translateY(78px); } 23%,100% { transform: translateY(78px); opacity: 0; } }
    @keyframes k1 { 0%,25% { transform: translate(-192px,9px); opacity: 0; } 27% { opacity: 1; } 38%,88% { transform: translate(0,0); opacity: 1; } 96%,100% { transform: translate(0,0); opacity: 0; } }
    @keyframes k2 { 0%,28% { transform: translate(-192px,-2px); opacity: 0; } 30% { opacity: 1; } 41%,88% { transform: translate(0,0); opacity: 1; } 96%,100% { transform: translate(0,0); opacity: 0; } }
    @keyframes k3 { 0%,31% { transform: translate(-192px,-13px); opacity: 0; } 33% { opacity: 1; } 44%,88% { transform: translate(0,0); opacity: 1; } 96%,100% { transform: translate(0,0); opacity: 0; } }
    @keyframes k4 { 0%,34% { transform: translate(-192px,-24px); opacity: 0; } 36% { opacity: 1; } 47%,88% { transform: translate(0,0); opacity: 1; } 96%,100% { transform: translate(0,0); opacity: 0; } }
    @keyframes s1 { 0% { opacity: 0; } 5% { opacity: 1; } 25% { opacity: 0; } }
    @keyframes s2 { 0% { opacity: 0; } 25% { opacity: 1; } 47% { opacity: 0; } }
    @keyframes s3 { 0% { opacity: 0; } 47% { opacity: 1; } 92% { opacity: 0; } }

    .bar    { animation: bar 2.6s ease-in-out infinite; }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes bar   { 0% { width: 0; } 70%,100% { width: 84px; } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
