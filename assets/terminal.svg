<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540">
  <!-- Generated into terminal.svg by scripts/update_terminal.py — edit this template, not the output. -->
  <style>
    text { font-family: 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 15px; white-space: pre; }
    .c { fill: #00e5ff; }
    .v { fill: #8b6cff; }
    .w { fill: #e8ecf5; }
    .g { fill: #7f8aa3; }
    .d { fill: #3a4459; }

    /* the gate scene: car rolls up, gets scanned, barrier lifts, car leaves, barrier drops */
    .car  { animation: car 7s cubic-bezier(.5,0,.3,1) infinite; }
    .arm  { transform-box: fill-box; transform-origin: 100% 50%; animation: arm 7s ease-in-out infinite; }
    .scan { animation: scan 7s steps(1) infinite; }
    .ok   { animation: ok 7s steps(1) infinite; }
    @keyframes car  { 0% { transform: translateX(-320px); } 30%,52% { transform: translateX(0); } 82%,100% { transform: translateX(480px); } }
    @keyframes arm  { 0%,40% { transform: rotate(0); } 50%,80% { transform: rotate(78deg); } 92%,100% { transform: rotate(0); } }
    @keyframes scan { 0% { opacity: 0; } 30% { opacity: 1; } 40% { opacity: 0; } }
    @keyframes ok   { 0% { opacity: 0; } 40% { opacity: 1; } 84% { opacity: 0; } }

    .bar    { animation: bar 2.6s ease-in-out infinite; }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes bar   { 0% { width: 0; } 70%,100% { width: 84px; } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
