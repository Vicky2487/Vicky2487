name: Refresh terminal stats

on:
  schedule:
    - cron: "30 0 * * *" # daily, 06:00 IST
  workflow_dispatch:
  push:
    paths:
      - assets/terminal.template.svg
      - scripts/update_terminal.py

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_terminal.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/terminal.svg
          git diff --staged --quiet || (git commit -m "Refresh terminal stats" && git push)
